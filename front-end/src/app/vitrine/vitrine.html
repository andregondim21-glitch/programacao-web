<div class="alert alert-danger" *ngIf="erro().length>0">{{erro()}}</div>
<div class="alert alert-info" *ngIf="carregando()">Carregando produtos...</div>
<div class="alert alert-warning" *ngIf="!carregando() && erro().length==0 && lista().length<=0"><strong>Vazio!</strong> 
    não existem produtos na vitrine!</div>

<div class="row">
    <div class="card col-12 col-sm-12 col-md-4 col-lg-3 col-xl-2" *ngFor="let obj of lista()">
        <img class="card-img-top" src="{{obj.codigo}}.jpg"  style="width:100%">
        <div class="card-body">
            <h4 class="card-title">{{obj.nome}}</h4>
            <p class="card-text" *ngIf="obj.valorPromo>0">
                 de: <s>R$ {{obj.valor}}</s><br>
                 por: R$ {{obj.valorPromo}}
            </p>
             <p class="card-text" *ngIf="obj.valorPromo<=0">
                 por: R$ {{obj.valor}}
            </p>
            <a href="#" class="btn btn-primary" (click)="verDetalhe(obj);">ver mais</a> 
            <a href="#" class="btn btn-success" (click)="adicionarItem(obj);"  *ngIf="obj.quantidade>0">comprar</a>
        </div>
    </div>

   
  
</div>
