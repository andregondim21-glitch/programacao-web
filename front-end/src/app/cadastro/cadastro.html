<h3>Cadastro</h3>

<div class="alert alert-success" *ngIf="mensagem.length>0">
{{mensagem}}    
</div>

<form class="was-validated">
<label for="txtNome" class="form-label">nome:</label>
<input type="text" class="form-control" name="txtNome" [(ngModel)]="obj.nome" 
placeholder="Informe o seu nome" required>
<div class="invalid-feedback">Preencha esse campo!</div>

<label for="txtEmail" class="form-label">email:</label>
<input type="email" class="form-control" name="txtEmail" [(ngModel)]="obj.email" 
placeholder="Informe o seu email" required>
<div class="invalid-feedback">Preencha esse campo!</div>

<label for="txtTelefone" class="form-label">telefone:</label>
<input type="text" class="form-control" name="txtTelefone" [(ngModel)]="obj.telefone"
placeholder="Informe o seu telefone" required pattern="[0-9]{4,5}-[0-9]{4}">
<div class="invalid-feedback">Preencha esse campo corretamente!</div>

<label for="txtDocumento" class="form-label">documento:</label>
<input type="text" class="form-control" name="txtDocumento" [(ngModel)]="obj.documento" 
placeholder="Informe o seu documento" required >
<div class="invalid-feedback">Preencha esse campo corretamente!</div>

<label for="txtSenha" class="form-label">senha:</label>
<input type="password" class="form-control" name="txtSenha" 
placeholder="Informe a sua senha" required  [(ngModel)]="obj.senha"
pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}"
   >
<div class="invalid-feedback">"A senha deve conter pelo menos 8 caracteres, incluindo uma letra maiúscula, uma letra minúscula, um número e um caractere especial (@$!%*?&)."</div>

 <label for="txtLogradouro" class="form-label">Endereço:</label>
<textarea class="form-control" name="txtLogradouro" [(ngModel)]="obj.logradouro"
placeholder="Informe o seu endereço completo" required  rows="5"></textarea>
<div class="invalid-feedback">"Endereço completo!"</div>


<button class="btn btn-success" (click)="gravar();">Atualizar</button>
</form>
