<h3>Faça seu login</h3>
<div class="alert alert-warning" *ngIf="mensagem.length>0">{{mensagem}}</div>

<div class="row">   
    <div class="col">
    Ja tenho cadastro, informe o seu e-mail e senha<br>
    <label  class="form-label">email:</label>
    <input type="email" id="email" [(ngModel)]="email"  class="form-control"><Br>
    <label  class="form-label">senha:</label>
    <input type="password" id="senha"  [(ngModel)]="senha"  class="form-control"><br>
    <button class="btn btn-outline-success w-100"
    (click)="fazerLogin();">Entrar</button>
    </div>
    <div  class="col">
    Ainda não tenho cadastro:<br>
    <a href="cadastro" class="btn btn-outline-primary w-100">faça seu novo cadastro</a>
    <br>
    Esqueci minha senha: <br>
    <a href="reenvio" class="btn btn-outline-danger w-100">Esqueci minha senha</a>
    </div>
</div>
