<div class="login-page">
  <div class="login-card">
    <div class="p-4 p-md-5">

      <div class="text-center mb-4">
        <i class="fa-solid fa-paw fa-2x mb-2" style="color: #2d5a4a;"></i>
        <h2 class="fw-bold">Crie sua conta</h2>
        <p class="text-muted">Preencha os dados abaixo para começar</p>
      </div>

      <form>
        <div class="mb-3">
          <label for="nome" class="form-label">Nome completo</label>
          <div class="input-group">
            <span class="input-group-text bg-white"><i class="fa-solid fa-user icon-pet"></i></span>
            <input type="text" class="form-control" id="nome" placeholder="Digite seu nome completo" required>
          </div>
        </div>

        <div class="row">
          <div class="col-12 col-md-6 mb-3">
            <label for="email" class="form-label">E-mail</label>
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="fa-solid fa-envelope icon-pet"></i></span>
              <input type="email" class="form-control" id="email" placeholder="seuemail@exemplo.com" required>
            </div>
          </div>

          <div class="col-12 col-md-6 mb-3">
            <label for="telefone" class="form-label">Telefone</label>
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="fa-solid fa-phone icon-pet"></i></span>
              <input type="tel" class="form-control" id="telefone" placeholder="(00) 00000-0000">
            </div>
          </div>
        </div>

        <div class="mb-3">
          <label for="cpf" class="form-label">CPF</label>
          <div class="input-group">
            <span class="input-group-text bg-white"><i class="fa-solid fa-id-card icon-pet"></i></span>
            <input type="text" class="form-control" id="cpf" placeholder="000.000.000-00" required>
          </div>
        </div>

        <div class="row">
          <div class="col-12 col-md-4 mb-3">
            <label for="cep" class="form-label">CEP</label>
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="fa-solid fa-map-pin icon-pet"></i></span>
              <input type="text" class="form-control" id="cep" placeholder="00000-000" required>
            </div>
          </div>

          <div class="col-12 col-md-8 mb-3">
            <label for="endereco" class="form-label">Endereço</label>
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="fa-solid fa-location-dot icon-pet"></i></span>
              <input type="text" class="form-control" id="endereco" placeholder="Rua, número, bairro, cidade - UF" required>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="col-12 col-md-6 mb-3">
            <label for="senha" class="form-label">Senha</label>
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="fa-solid fa-lock icon-pet"></i></span>
              <input type="password" class="form-control" id="senha" placeholder="Crie uma senha" required>
            </div>
          </div>

          <div class="col-12 col-md-6 mb-3">
            <label for="confirmarSenha" class="form-label">Confirmar senha</label>
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="fa-solid fa-lock icon-pet"></i></span>
              <input type="password" class="form-control" id="confirmarSenha" placeholder="Repita a senha" required>
            </div>
          </div>
        </div>

        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="termos" required>
          <label class="form-check-label" for="termos">
            Eu concordo com os <a class="link-pet">Termos de Uso</a> e a <a class="link-pet">Política de Privacidade</a>
          </label>
        </div>

        <div class="d-grid mb-3">
          <button type="submit" class="btn btn-pet btn-lg">
            <i class="fa-solid fa-user-plus me-2"></i>Cadastrar
          </button>
        </div>

        <p class="text-center text-muted mb-0">
          Já tem uma conta? <a href="login" class="link-pet fw-semibold">Faça login</a>
        </p>
      </form>

    </div>
  </div>
</div>
