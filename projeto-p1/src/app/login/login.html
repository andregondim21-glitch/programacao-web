<div class="login-page">
  <div class="login-card">
    <div class="row g-0">

      <div class="col-md-5 login-side-image d-none d-md-flex">
        <i class="fa-solid fa-paw"></i>
        <h3 class="fw-bold">FATEC's Pet Shop</h3>
        <p class="mb-0">Tudo para o seu melhor amigo em um só lugar 🐾</p>
      </div>

      <div class="col-12 col-md-7">
        <div class="p-4 p-md-5">

          <div class="text-center mb-4" >
            <i class="fa-solid fa-2x text-warning d-md-none mb-2"  ></i>
            <h2 class="fw-bold">Bem-vindo de volta!</h2>
            <p class="text-muted">Entre na sua conta para continuar</p>
          </div>

          <form>
            <div class="mb-3">
              <label for="email" class="form-label">E-mail</label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="fa-solid fa-envelope" style="color: #2d5a4a;"></i></span>
                <input type="email" class="form-control" id="email" placeholder="seuemail@exemplo.com" required>
              </div>
            </div>

            <div class="mb-3">
              <label for="senha" class="form-label">Senha</label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="fa-solid fa-lock" style="color: #2d5a4a;"></i></span>
                <input type="password" class="form-control" id="senha" placeholder="Digite sua senha" required>
              </div>
            </div>

            <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-4">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="lembrar">
                <label class="form-check-label" for="lembrar">
                  Lembrar de mim
                </label>
              </div>
              <a href="#" class="link-pet small">Esqueci minha senha</a>
            </div>

            <div class="d-grid mb-3">
              <button type="submit" class="btn btn-pet btn-lg">
                <i class="fa-solid fa-right-to-bracket me-2"></i>Entrar
              </button>
            </div>

            <p class="text-center text-muted mb-0">
              Não tem uma conta? <a href="cadastro" class="link-pet fw-semibold">Cadastre-se</a>
            </p>
          </form>

        </div>
      </div>

    </div>
  </div>
</div>
