spring.application.name=back-petshop
server.port=8080
spring.config.import=optional:file:.env[.properties]

# ---------- MySQL ----------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Cria/atualiza as tabelas automaticamente a partir das entidades (pacote model)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ---------- Configurações do petshop ----------
petshop.cors.origins=http://localhost:4200
petshop.frontend-url=http://localhost:4200
petshop.reset-senha.validade-minutos=30
petshop.reset-senha.expor-token=false

# ---------- E-mail (SMTP) ----------
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
petshop.mail.from=${MAIL_REMETENTE}
